<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryan Rokade — 1990s Alpha Pager Dispatch (Variant 45)</title>
  <meta name="description" content="1990s Retro Alphanumeric Pager / Beeper portfolio of Aryan Rokade, Full Stack Developer & AI Engineer.">
  <link rel="stylesheet" href="switcher.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --pager-casing: #1e2229;
      --casing-bevel: #323844;
      --lcd-bg: #829a67;
      --lcd-text: #192610;
      --lcd-lit-bg: #98e04b;
      --lcd-lit-text: #0d2105;
      --font-lcd: 'VT323', monospace;
      --font-body: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      background-image: radial-gradient(circle at 50% 30%, #1c2331 0%, #06090e 100%);
      color: #e6edf3;
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pager-device {
      width: 100%;
      max-width: 640px;
      background: linear-gradient(145deg, #2b313a, #15181e);
      border: 8px solid #3d4552;
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 35px 80px rgba(0,0,0,0.95), inset 0 2px 4px rgba(255,255,255,0.15);
      position: relative;
    }

    /* Belt Clip Impression */
    .belt-clip-ridge {
      position: absolute;
      top: -14px;
      right: 40px;
      width: 100px;
      height: 18px;
      background: #444b59;
      border-radius: 6px 6px 0 0;
      border: 2px solid #282d36;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .pager-brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #9aa7b8;
    }
    .pager-status-led {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #7d8b99;
    }
    .led-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #238636;
      box-shadow: 0 0 10px #238636;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* LCD Screen Frame */
    .lcd-frame {
      background: #111417;
      border: 4px solid #0d0f12;
      border-radius: 12px;
      padding: 16px;
      box-shadow: inset 0 8px 16px rgba(0,0,0,0.8);
      margin-bottom: 24px;
    }

    .lcd-display {
      background: var(--lcd-bg);
      color: var(--lcd-text);
      font-family: var(--font-lcd);
      border-radius: 6px;
      padding: 16px 20px;
      min-height: 220px;
      position: relative;
      transition: background 0.2s, color 0.2s;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }
    .lcd-display.backlight-on {
      background: var(--lcd-lit-bg);
      color: var(--lcd-lit-text);
      box-shadow: 0 0 25px rgba(152, 224, 75, 0.4), inset 0 0 15px rgba(0,0,0,0.1);
    }

    .lcd-top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      border-bottom: 2px dashed rgba(0,0,0,0.4);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .lcd-message-text {
      font-size: 1.6rem;
      line-height: 1.3;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 130px;
    }

    /* Pager Mechanical Controls */
    .pager-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .pager-btn {
      background: linear-gradient(180deg, #3c4452, #232830);
      color: #cfd8e3;
      border: 2px solid #555f70;
      border-radius: 10px;
      padding: 12px 6px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 0 #13161c, 0 8px 12px rgba(0,0,0,0.6);
      transition: all 0.1s;
      text-align: center;
      user-select: none;
    }
    .pager-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #13161c;
    }

    /* Action Links Bar */
    .pager-links-dock {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .dock-link {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.8rem;
      padding: 6px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.2s;
    }
    .dock-link:hover {
      background: rgba(88, 166, 255, 0.2);
      border-color: #58a6ff;
    }
  </style>
</head>
<body>

  <div class="pager-device">
    <div class="belt-clip-ridge"></div>

    <div class="brand-header">
      <div class="pager-brand">MOTOROLA &bull; ADVISOR PRO</div>
      <div class="pager-status-led">
        <span class="led-dot"></span>
        <span>900 MHz SYNTHESIZED</span>
      </div>
    </div>

    <!-- LCD Display Unit -->
    <div class="lcd-frame">
      <div id="lcdScreen" class="lcd-display">
        <div class="lcd-top-bar">
          <span id="pageCounter">PAGE 1/5 [NEW MSG]</span>
          <span id="timeClock" onclick="toggleAlertMode();" style="cursor: pointer; user-select: none;" title="Click to Cycle Sound: Audible / Vibrate / Silent">12:30 PM &bull; <span id="soundModeLabel">🔔 AUDIBLE</span></span>
        </div>
        <div id="lcdText" class="lcd-message-text"></div>
      </div>
    </div>

    <!-- Keypad -->
    <div class="pager-controls">
      <button class="pager-btn" onclick="prevMessage()">◀ PREV</button>
      <button class="pager-btn" onclick="nextMessage()">NEXT ▶</button>
      <button class="pager-btn" onclick="toggleBacklight()">💡 LIGHT</button>
      <button class="pager-btn" onclick="chirpAlert()" style="color: #ff7b72;" title="Incoming Page Alert Test">🚨 ALERT</button>
    </div>

    <!-- External Action Links -->
    <div class="pager-links-dock">
      <a href="../Aryan_Rokade_Resume.pdf" class="dock-link" download>📄 RESUME PDF</a>
      <a href="https://github.com/aryanrokade7" target="_blank" class="dock-link">🐙 GITHUB</a>
      <a href="https://linkedin.com/in/aryan-rokade-git-aryanrokade7/" target="_blank" class="dock-link">💼 LINKEDIN</a>
      <a href="mailto:aryanrokade416@gmail.com" class="dock-link">✉️ SEND EMAIL</a>
      <a href="tel:8591224192" class="dock-link">📞 +91 85912 24192</a>
    </div>
  </div>

  <script>
    const messages = [
      "FROM: ARYAN ROKADE\nROLE: FULL STACK & AI DEV\nCOLLEGE: VCET MUMBAI '27\nSTACK: NEXT.JS, REACT, PYTHON, TENSORFLOW\nSTATUS: AVAILABLE FOR HIRE",
      "MSG 2/5 - PROJECT: VYAPARFLOW\n&gt; MSME EXPORT LOGISTICS & COMPLIANCE\n&gt; AUTOMATED PDF INVOICES & LEDGER\n&gt; NEXT.JS, REACT, TS, POSTGRESQL, PRISMA\nURL: VYAPARFLOW-SMOKY.VERCEL.APP",
      "MSG 3/5 - PROJECT: CYBERSENTINEL\n&gt; REAL-TIME NETWORK INTRUSION SUITE\n&gt; PACKET MONITOR W/ LIVE WEBSOCKETS\n&gt; REACT, SOCKET.IO, FLASK, PYTHON\nSTATUS: ACTIVE DEFENSE SHIELD",
      "MSG 4/5 - PROJECT: SATURN & MRI AI\n&gt; SATURN: EXPENSE & BUDGET MERN ENGINE\n&gt; MRI AI: BRAIN TUMOR VGG16 (98.4% ACC)\nTECH: MERN, REDUX, TENSORFLOW, KERAS",
      "MSG 5/5 - ACCOLADES & EXP\n★ 2ND PLACE TECHBLITZ NATIONAL HACKATHON\n★ WEB DEV INTERN @ OCTANET SERVICES\nCALL: +91 85912 24192 | ARYANROKADE416@GMAIL.COM\nMUMBAI, INDIA"
    ];

    let currentMsg = 0;
    let isLit = false;

    let audioCtx = null;
    let alertMode = 'AUDIBLE'; // 'AUDIBLE' | 'VIBRATE' | 'SILENT'

    function initPagerAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, () => initPagerAudio(), { once: true });
    });

    // Authentic 2.7kHz piezoelectric beeper diaphragm
    function playBeep(freq = 2730, dur = 0.05, vol = 0.14) {
      if (alertMode === 'SILENT') return;
      if (alertMode === 'VIBRATE') {
        playVibrateMotor(dur * 2);
        return;
      }
      initPagerAudio();
      if (!audioCtx) return;

      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // High-Q square wave characteristic of piezo ceramic discs
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + dur);
      } catch (e) {}
    }

    // Physical pager vibration motor rumble (60Hz modulated harmonic)
    function playVibrateMotor(dur = 0.2) {
      if (alertMode === 'SILENT') return;
      initPagerAudio();
      if (navigator.vibrate) {
        try { navigator.vibrate(Math.round(dur * 1000)); } catch (e) {}
      }
      if (!audioCtx) return;

      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(65, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(140, now);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + dur);
      } catch (e) {}
    }

    // Iconic 90s Motorola Advisor 4-chirp page alert sequence
    function chirpAlert() {
      initPagerAudio();
      const dot = document.querySelector('.led-dot');
      if (dot) {
        dot.style.background = '#ef4444';
        dot.style.boxShadow = '0 0 16px #ef4444';
      }

      // 4 double-chirps with vibration bursts
      for (let i = 0; i < 4; i++) {
        const tOffset = i * 280;
        setTimeout(() => {
          playVibrateMotor(0.12);
          if (alertMode === 'AUDIBLE') {
            playBeep(2730, 0.05, 0.16);
            setTimeout(() => playBeep(3200, 0.06, 0.18), 65);
          }
        }, tOffset);
      }

      setTimeout(() => {
        if (dot) {
          dot.style.background = '#238636';
          dot.style.boxShadow = '0 0 10px #238636';
        }
      }, 1300);
    }

    function toggleAlertMode() {
      if (alertMode === 'AUDIBLE') {
        alertMode = 'VIBRATE';
      } else if (alertMode === 'VIBRATE') {
        alertMode = 'SILENT';
      } else {
        alertMode = 'AUDIBLE';
      }

      const label = document.getElementById('soundModeLabel');
      if (label) {
        if (alertMode === 'AUDIBLE') label.innerText = '🔔 AUDIBLE';
        else if (alertMode === 'VIBRATE') label.innerText = '📳 VIBRATE';
        else label.innerText = '🔕 SILENT';
      }

      if (alertMode === 'AUDIBLE') playBeep(2730, 0.08);
      else if (alertMode === 'VIBRATE') playVibrateMotor(0.2);
    }

    function renderMessage() {
      document.getElementById('pageCounter').innerText = `PAGE ${currentMsg + 1}/${messages.length} [DISPATCH]`;
      document.getElementById('lcdText').innerText = messages[currentMsg];
    }

    function nextMessage() {
      playBeep(2730, 0.045);
      currentMsg = (currentMsg + 1) % messages.length;
      renderMessage();
    }

    function prevMessage() {
      playBeep(2180, 0.045);
      currentMsg = (currentMsg - 1 + messages.length) % messages.length;
      renderMessage();
    }

    function toggleBacklight() {
      // Switch tick + subtle EL inverter high-frequency coil buzz
      initPagerAudio();
      playBeep(4200, 0.03, 0.05);
      isLit = !isLit;
      document.getElementById('lcdScreen').classList.toggle('backlight-on', isLit);
    }

    // Attach click feedback to external dock links
    document.querySelectorAll('.dock-link').forEach(link => {
      link.addEventListener('click', () => playBeep(2400, 0.04));
    });

    // Keyboard navigation for pager
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextMessage();
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevMessage();
      else if (k === 'l') toggleBacklight();
      else if (k === 'a' || e.key === ' ') chirpAlert();
      else if (k === 'm') toggleAlertMode();
    });

    // Initial load
    renderMessage();
  </script>
  <script src="switcher.js"></script>
</body>
</html>
