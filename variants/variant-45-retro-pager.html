<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryan Rokade — 90s Motorola Alpha Pager</title>
  <meta name="description" content="1990s Retro Alphanumeric Pager / Beeper portfolio of Aryan Rokade, Full Stack Developer & AI Engineer.">
  <link rel="stylesheet" href="switcher.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --pager-casing: #1e2229;
      --casing-bevel: #323844;
      --lcd-bg: #829a67;
      --lcd-text: #192610;
      --lcd-lit-bg: #98e04b;
      --lcd-lit-text: #0d2105;
      --font-lcd: 'VT323', monospace;
      --font-body: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      background-image: radial-gradient(circle at 50% 30%, #1c2331 0%, #06090e 100%);
      color: #e6edf3;
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pager-device {
      width: 100%;
      max-width: 640px;
      background: linear-gradient(145deg, #2b313a, #15181e);
      border: 8px solid #3d4552;
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 35px 80px rgba(0,0,0,0.95), inset 0 2px 4px rgba(255,255,255,0.15);
      position: relative;
    }

    /* Belt Clip Impression */
    .belt-clip-ridge {
      position: absolute;
      top: -14px;
      right: 40px;
      width: 100px;
      height: 18px;
      background: #444b59;
      border-radius: 6px 6px 0 0;
      border: 2px solid #282d36;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .pager-brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #9aa7b8;
    }
    .pager-status-led {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #7d8b99;
    }
    .led-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #238636;
      box-shadow: 0 0 10px #238636;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* LCD Screen Frame */
    .lcd-frame {
      background: #111417;
      border: 4px solid #0d0f12;
      border-radius: 12px;
      padding: 16px;
      box-shadow: inset 0 8px 16px rgba(0,0,0,0.8);
      margin-bottom: 24px;
    }

    .lcd-display {
      background: var(--lcd-bg);
      color: var(--lcd-text);
      font-family: var(--font-lcd);
      border-radius: 6px;
      padding: 16px 20px;
      min-height: 220px;
      position: relative;
      transition: background 0.2s, color 0.2s;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }
    .lcd-display.backlight-on {
      background: var(--lcd-lit-bg);
      color: var(--lcd-lit-text);
      box-shadow: 0 0 25px rgba(152, 224, 75, 0.4), inset 0 0 15px rgba(0,0,0,0.1);
    }

    .lcd-top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      border-bottom: 2px dashed rgba(0,0,0,0.4);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .lcd-message-text {
      font-size: 1.6rem;
      line-height: 1.3;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 130px;
    }

    /* Pager Mechanical Controls */
    .pager-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .pager-btn {
      background: linear-gradient(180deg, #3c4452, #232830);
      color: #cfd8e3;
      border: 2px solid #555f70;
      border-radius: 10px;
      padding: 12px 6px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 0 #13161c, 0 8px 12px rgba(0,0,0,0.6);
      transition: all 0.1s;
      text-align: center;
      user-select: none;
    }
    .pager-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #13161c;
    }

    /* Action Links Bar */
    .pager-links-dock {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .dock-link {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.8rem;
      padding: 6px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.2s;
    }
    .dock-link:hover {
      background: rgba(88, 166, 255, 0.2);
      border-color: #58a6ff;
    }
  </style>
</head>
<body>

  <div class="pager-device">
    <div class="belt-clip-ridge"></div>

    <div class="brand-header">
      <div class="pager-brand">MOTOROLA &bull; ADVISOR PRO</div>
      <div class="pager-status-led">
        <span class="led-dot"></span>
        <span>900 MHz SYNTHESIZED</span>
      </div>
    </div>

    <!-- LCD Display Unit -->
    <div class="lcd-frame">
      <div id="lcdScreen" class="lcd-display">
        <div class="lcd-top-bar">
          <span id="pageCounter">PAGE 1/5 [NEW MSG]</span>
          <span id="timeClock">12:30 PM &bull; 🔕 CHIRP</span>
        </div>
        <div id="lcdText" class="lcd-message-text"></div>
      </div>
    </div>

    <!-- Keypad -->
    <div class="pager-controls">
      <button class="pager-btn" onclick="prevMessage()">◀ PREV</button>
      <button class="pager-btn" onclick="nextMessage()">NEXT ▶</button>
      <button class="pager-btn" onclick="toggleBacklight()">💡 LIGHT</button>
      <button class="pager-btn" onclick="chirpAlert()">🔔 BEEP</button>
    </div>

    <!-- External Action Links -->
    <div class="pager-links-dock">
      <a href="../Aryan_Rokade_Resume.pdf" class="dock-link" download>📄 RESUME PDF</a>
      <a href="https://github.com/aryanrokade7" target="_blank" class="dock-link">🐙 GITHUB</a>
      <a href="https://linkedin.com/in/aryan-rokade" target="_blank" class="dock-link">💼 LINKEDIN</a>
      <a href="mailto:aryanrokade07@gmail.com" class="dock-link">✉️ SEND EMAIL</a>
    </div>
  </div>

  <script>
    const messages = [
      "FROM: ARYAN ROKADE\nROLE: FULL STACK & AI DEV\nCOLLEGE: VCET MUMBAI '27 (CGPA 8.7+)\nSTACK: REACT, NEXT.JS, NODE, PYTORCH\nSTATUS: AVAILABLE FOR DISPATCH",
      "MSG 2/5 - PROJECT: VYAPARFLOW\n&gt; MSME INVENTORY & GST BILLING\n&gt; AUTOMATED PDF INVOICES & RAZORPAY\n&gt; BUILT W/ NEXT.JS, NODE & POSTGRES\nCODE: GITHUB/ARYANROKADE7/VYAPARFLOW",
      "MSG 3/5 - PROJECT: CYBERSENTINEL\n&gt; REAL-TIME NETWORK INTRUSION MONITOR\n&gt; PACKET SNIFFER W/ LIVE WEBSOCKETS\n&gt; BUILT W/ PYTHON, SCAPY & FASTAPI\nSTATUS: 0 ANOMALIES DETECTED",
      "MSG 4/5 - PROJECT: SATURN FINANCE & MRI AI\n&gt; SATURN: CRYPTO BALANCE & GAS TRACKER\n&gt; MRI AI: TUMOR SEGMENTATION 95% ACC\nTECH: ETHERS.JS, PYTORCH, U-NET, DOCKER",
      "MSG 5/5 - ACCOLADES & EXP\n★ 2ND PLACE TECHBLITZ NATIONAL HACKATHON\n★ WEB DEV INTERN @ OCTANET SERVICES\nCALL: ARYANROKADE07@GMAIL.COM\nMUMBAI, MH, INDIA"
    ];

    let currentMsg = 0;
    let isLit = false;

    function playBeep(freq = 1760, duration = 0.08) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function renderMessage() {
      document.getElementById('pageCounter').innerText = `PAGE ${currentMsg + 1}/${messages.length} [DISPATCH]`;
      document.getElementById('lcdText').innerText = messages[currentMsg];
    }

    function nextMessage() {
      playBeep(2200, 0.06);
      currentMsg = (currentMsg + 1) % messages.length;
      renderMessage();
    }

    function prevMessage() {
      playBeep(1800, 0.06);
      currentMsg = (currentMsg - 1 + messages.length) % messages.length;
      renderMessage();
    }

    function toggleBacklight() {
      playBeep(800, 0.04);
      isLit = !isLit;
      document.getElementById('lcdScreen').classList.toggle('backlight-on', isLit);
    }

    function chirpAlert() {
      playBeep(2400, 0.08);
      setTimeout(() => playBeep(2400, 0.08), 120);
      setTimeout(() => playBeep(2800, 0.15), 240);
    }

    // Initial load
    renderMessage();
  </script>
  <script src="switcher.js"></script>
</body>
</html>
